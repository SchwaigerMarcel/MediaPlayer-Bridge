name: Build Windows release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore src/MediaPlayerBridge/MediaPlayerBridge.csproj

      - name: Publish self-contained executable
        run: >
          dotnet publish src/MediaPlayerBridge/MediaPlayerBridge.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output publish

      - name: Create ZIP package
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath MediaPlayerBridge-win-x64.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaPlayerBridge-win-x64
          path: MediaPlayerBridge-win-x64.zip
          if-no-files-found: error

      - name: Create GitHub release
        if: "${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}"
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $releaseTag = "${{ github.ref_name }}"
          if ($env:GITHUB_REF -eq "refs/heads/main") {
            $releaseTag = "v1.0.0"
          }
          gh release view $releaseTag 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $releaseTag already exists."
            exit 0
          }
          gh release create $releaseTag MediaPlayerBridge-win-x64.zip --title "MediaPlayerBridge $releaseTag" --generate-notes
