name: Build Windows release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore src/MediaPlayerBridge/MediaPlayerBridge.csproj

      - name: Publish one self-contained executable
        run: >
          dotnet publish src/MediaPlayerBridge/MediaPlayerBridge.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          --output publish

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaPlayerBridge
          path: publish\MediaPlayerBridge.exe
          if-no-files-found: error

      - name: Create or update GitHub release
        if: "${{ startsWith(github.ref, 'refs/tags/v') || github.event.head_commit.message == 'release: rebuild v1.0.0 as single file' }}"
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $releaseTag = "${{ github.ref_name }}"
          if ($env:GITHUB_REF -eq "refs/heads/main") {
            $releaseTag = "v1.0.0"
          }

          gh release delete-asset $releaseTag MediaPlayerBridge-win-x64.zip --yes 2>$null
          gh release view $releaseTag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $releaseTag publish\MediaPlayerBridge.exe --clobber
          }
          else {
            gh release create $releaseTag publish\MediaPlayerBridge.exe --title "MediaPlayerBridge $releaseTag" --generate-notes
          }
